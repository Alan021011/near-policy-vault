[package]
name = "mock-signer"
version = "0.1.0"
edition = "2021"
publish = false

# Test helper only (M9): stands in for the NEAR Chain Signatures contract inside the local
# sandbox, where the MPC network does not exist. Never deploy it next to real funds.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5.1"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
near-sdk = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
