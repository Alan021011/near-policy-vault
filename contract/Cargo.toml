[package]
name = "policy-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5.1"
near-contract-standards = "5.30.0"
near-sdk = "5.30.0"
sha3 = "0.12.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

# Recommended settings for NEAR contracts: small wasm, panics abort, overflow checked.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
