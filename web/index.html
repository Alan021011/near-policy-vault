<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Review M12 (R12-1): no plugins, no <base> hijack, forms post only here. Scripts are not
         restricted further because the wallet connector runs wallet code in sandboxed iframes. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Policy Vault</title>
    <meta name="description" content="An NFT that owns an Ethereum account and can only spend under a policy enforced by a NEAR contract (NEAR Chain Signatures, testnet + Sepolia)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">Policy Vault</a>
      <span class="badge neutral">NEAR testnet · Sepolia</span>
      <span class="spacer"></span>
      <span id="account" class="mono muted"></span>
      <button id="connect" class="btn primary">Connect wallet</button>
    </header>
    <main id="app"></main>
    <div id="toast" class="toast" hidden></div>
    <footer class="footer">
      <span>Testnet demo. Test funds only.</span>
      <a href="https://github.com/Alan021011/near-policy-vault" target="_blank" rel="noreferrer">Source</a>
      <a href="https://github.com/Alan021011/near-policy-vault/blob/main/docs/THREAT_MODEL.md" target="_blank" rel="noreferrer">Threat model</a>
      <span id="contract-link"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
