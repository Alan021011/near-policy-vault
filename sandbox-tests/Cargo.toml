[package]
name = "sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false

# M9: integration tests that run the real wasm of the vault, the test receiver and a mock
# Chain Signatures contract in a local NEAR sandbox (nearcore 2.14.0, the version testnet runs),
# with real cross-contract promises, callbacks and yield/resume. See README.md in this folder.
# The sandbox only runs on Linux (x86_64, aarch64) and macOS (arm64); on Windows use WSL.

[dependencies]
anyhow = "1"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
near-workspaces = "0.24.0"
serde = "1"
serde_json = "1"
sha3 = "0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
